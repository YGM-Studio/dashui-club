/var/log/nginx/club.access.log /var/log/nginx/club.error.log {
    daily
    maxsize 10M
    rotate 3
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        if [ -f /run/nginx.pid ]; then kill -USR1 $(cat /run/nginx.pid); fi
    endscript
}
