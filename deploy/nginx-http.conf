map "$request_method:$uri" $club_write_key {
    default "";
    ~^(POST|PUT):/api/entries(?:/[^/]+)?$ "club-entry-write";
}
limit_conn_zone $club_write_key zone=club_writes:1m;
server {
    listen 80;
    listen [::]:80;
    server_name club.1gemo.com;
    access_log /var/log/nginx/club.access.log;
    error_log /var/log/nginx/club.error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 503 "社区正在部署，请稍后访问。\n"; }
}
