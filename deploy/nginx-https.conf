map "$request_method:$uri" $club_write_key {
    default "";
    ~^(POST|PUT):/api/entries(?:/[^/]+)?$ "club-entry-write";
}
limit_conn_zone $club_write_key zone=club_writes:1m;
server {
    listen 80;
    listen [::]:80;
    server_name club.1gemo.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://club.1gemo.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name club.1gemo.com;
    ssl_certificate /etc/letsencrypt/live/club.1gemo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.1gemo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 8m;
    client_body_timeout 30s;
    access_log /var/log/nginx/club.access.log;
    error_log /var/log/nginx/club.error.log warn;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /srv/dashui-club/active-location.conf;
}
